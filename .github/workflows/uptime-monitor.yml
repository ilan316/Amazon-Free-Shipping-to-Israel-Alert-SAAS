name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Check sites and alert Telegram if down
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os, sys
          from datetime import datetime, timezone

          TELEGRAM_TOKEN = os.environ["TELEGRAM_TOKEN"].strip()
          TELEGRAM_CHAT_ID = os.environ["TELEGRAM_CHAT_ID"].strip()

          SITES = [
              "https://app.amzfreeil.com",
              "https://www.amzfreeil.com",
          ]

          def check_site(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "UptimeMonitor/1.0"})
                  res = urllib.request.urlopen(req, timeout=15)
                  return res.status, None
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  return None, str(e)

          def send_telegram(message):
              data = json.dumps({
                  "chat_id": int(TELEGRAM_CHAT_ID),
                  "text": message,
                  "parse_mode": "HTML"
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
                  data=data,
                  headers={"Content-Type": "application/json"}
              )
              urllib.request.urlopen(req, timeout=10)

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          down_sites = []

          for url in SITES:
              status, error = check_site(url)
              if error:
                  down_sites.append(f"❌ {url}\n   שגיאה: {error}")
                  print(f"DOWN: {url} — {error}")
              elif status and status >= 500:
                  down_sites.append(f"❌ {url}\n   קוד תגובה: {status}")
                  print(f"DOWN: {url} — HTTP {status}")
              else:
                  print(f"OK: {url} — HTTP {status}")

          if down_sites:
              sites_text = "\n\n".join(down_sites)
              message = (
                  f"🚨 <b>amzfreeil — אתר לא זמין</b>\n\n"
                  f"{sites_text}\n\n"
                  f"🕐 {now}"
              )
              send_telegram(message)
              print("Alert sent to Telegram")
              sys.exit(1)
          else:
              print("All sites OK")
          EOF
